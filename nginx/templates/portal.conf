server {
    listen 80;
    listen [::]:80;

    server_name portal.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html/letsencrypt/;
        log_not_found off;
    }

    return 301 https://$host$request_uri;
}

server {
    client_max_body_size 20M;
    proxy_read_timeout 1m;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Permissions-Policy "geolocation=()";
    add_header X-Powered-By "";

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    http2 on;
    server_tokens off;
    autoindex off;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/ssl/cert-cloudflare.pem;
    ssl_certificate_key /etc/nginx/ssl/priv-cloudflare.pem;

    server_name portal.__DOMAIN__;
    root /var/www/html/FrontEnd/dist;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|ttf|svg|eot)$ {
        try_files $uri =404;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/portal_error.log;
    access_log /var/log/nginx/portal_access.log;
}
