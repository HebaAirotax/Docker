server {
    listen 80;
    listen [::]:80;

    server_name billing.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html/letsencrypt/;
        log_not_found off;
    }

    return 301 https://$host$request_uri;
}

server {
    client_max_body_size 20M;
    proxy_read_timeout 1m;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Permissions-Policy "geolocation=()";
    add_header X-Powered-By "";

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    http2 on;
    server_tokens off;
    autoindex off;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/ssl/cert-cloudflare.pem;
    ssl_certificate_key /etc/nginx/ssl/priv-cloudflare.pem;

    server_name billing.__DOMAIN__;
    root /var/www/html/Billing-Service/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60000;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/billing_error.log;
    access_log /var/log/nginx/billing_access.log;
}
