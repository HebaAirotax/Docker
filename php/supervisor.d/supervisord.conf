; Portal services — supervisord program definitions
; Mounted into container at /etc/supervisor/programs.d/supervisord.conf
; Regenerated by install.sh --force  (or edit here for manual tweaks)

; ── Core-Service ─────────────────────────────────────────────────────────────
[program:queue-core-service]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/Core-Service/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/Core-Service/storage/logs/supervisor-queue.log

; ── Notifications-Service ────────────────────────────────────────────────────
[program:queue-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/Notifications-Service/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
user=root
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/html/Notifications-Service/storage/logs/supervisor-queue.log

[program:reverb]
process_name=%(program_name)s
command=php /var/www/html/Notifications-Service/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/Notifications-Service/storage/logs/supervisor-reverb.log

